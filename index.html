<title>Onésime — Archives généalogiques</title>
<style>
:root{--bg:#090f1c;--sur:#111d35;--sur2:#192844;--brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);--tx:#d4c9b0;--txm:rgba(212,201,176,.55);--txf:rgba(212,201,176,.2);--ac:#8b5cf6;--acg:rgba(139,92,246,.18);--acs:rgba(139,92,246,.1);--ct:#f97316;--cth:#fb8c2a;--gd:#c4962a}

:root[data-theme=dark]{--bg:#090f1c;--sur:#111d35;--sur2:#192844;--brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);--tx:#d4c9b0;--txm:rgba(212,201,176,.55);--txf:rgba(212,201,176,.2);--ac:#8b5cf6;--acg:rgba(139,92,246,.18);--acs:rgba(139,92,246,.1);--ct:#f97316;--cth:#fb8c2a;--gd:#c4962a}
:root[data-theme=light]{--bg:#f4ede0;--sur:#ece3d2;--sur2:#e3d8c4;--brd:rgba(0,0,0,.08);--brd2:rgba(0,0,0,.15);--tx:#1c1410;--txm:rgba(28,20,16,.55);--txf:rgba(28,20,16,.18);--ac:#7c3aed;--acg:rgba(124,58,237,.12);--acs:rgba(124,58,237,.08);--ct:#d95c00;--cth:#c05200;--gd:#9a7420}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 32px}
@media(max-width:768px){.wrap{padding:0 20px}}

.lm{background:var(--sur);border-radius:7px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;flex-shrink:0;border:1px solid var(--brd)}
.lm span{border-radius:1.5px;display:block}
.lm span:nth-child(1){background:#8b5cf6}.lm span:nth-child(2){background:#f97316}
.lm span:nth-child(3){background:#f97316}.lm span:nth-child(4){background:#8b5cf6}

/* NAV */
#nav{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:56px;gap:24px}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:18px;color:var(--tx)}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{font-size:14px;color:var(--txm);transition:color .15s}
.nav-links a:hover{color:var(--tx)}
.btn-ndl{background:var(--ct);color:#fff;font-size:13px;font-weight:600;padding:7px 18px;border-radius:6px;transition:background .15s,transform .1s;white-space:nowrap}
.btn-ndl:hover{background:var(--cth);transform:translateY(-1px)}
@media(max-width:600px){.nav-links{display:none}}

/* HERO */
.hero{padding:80px 0 64px;position:relative;overflow:hidden}
.hero-glow{position:absolute;width:600px;height:500px;background:radial-gradient(ellipse,var(--acg) 0%,transparent 65%);top:-80px;right:-60px;pointer-events:none}
.hero-g{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media(max-width:900px){.hero-g{grid-template-columns:1fr;gap:48px}}

.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:500;margin-bottom:18px}
.eyebrow::before{content:'';width:18px;height:1px;background:var(--ac);flex-shrink:0}
h1.htitle{font-family:Georgia,serif;font-size:clamp(36px,4.2vw,54px);font-weight:normal;line-height:1.1;color:var(--tx);text-wrap:balance;margin-bottom:20px;letter-spacing:-.5px}
h1.htitle .hi{color:var(--ac)}
.hdesc{font-size:16px;color:var(--txm);line-height:1.7;max-width:420px;margin-bottom:32px}
@media(max-width:900px){.hdesc{max-width:none}}
.hact{display:flex;gap:12px;flex-wrap:wrap}
.hnote{margin-top:14px;font-size:12px;color:var(--txf)}
.btn-p{display:inline-flex;align-items:center;gap:8px;background:var(--ct);color:#fff;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;transition:background .15s,transform .1s}
.btn-p:hover{background:var(--cth);transform:translateY(-1px)}
.btn-g{display:inline-flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--brd2);color:var(--txm);font-size:15px;padding:12px 24px;border-radius:8px;transition:border-color .15s,color .15s}
.btn-g:hover{border-color:var(--ac);color:var(--tx)}

/* APP WINDOW shell */
.aw{background:#0b1627;border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04)}
.atb{display:flex;align-items:center;padding:0 0 0 12px;background:#08111e;border-bottom:1px solid rgba(255,255,255,.07);height:32px;gap:8px;flex-shrink:0}
.atxt{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.03em;flex:1}
.awctrls{display:flex;height:100%}
.awctrl{width:40px;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.2);font-family:system-ui}
.awctrl.cls{background:rgba(255,255,255,.03)}
.abody{display:flex;overflow:hidden}

/* Sidebar */
.asb{width:44px;background:#070e1a;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex-shrink:0}
.si{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative}
.si.on{background:rgba(139,92,246,.2)}
.si-ic{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.1)}
.si.on .si-ic{background:#8b5cf6}
.si-dot{width:4px;height:4px;border-radius:50%;background:var(--ct);position:absolute;top:4px;right:4px}

/* ─────────── MOCKUP 1 : EXPLORATEUR ─────────── */
.exp-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.exp-toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.exp-search{flex:1;height:22px;background:rgba(255,255,255,.06);border-radius:4px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 8px;gap:6px}
.exp-search-ic{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2)}
.exp-search-line{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px}
.exp-pill{height:20px;padding:0 8px;border-radius:4px;font-size:9px;display:flex;align-items:center;color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.07)}
.exp-pill.on{background:rgba(139,92,246,.15);color:#b39dff;border-color:rgba(139,92,246,.3)}
.exp-count{font-size:9px;color:rgba(212,201,176,.5);margin-left:auto}
.exp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;overflow:hidden}
.tc{aspect-ratio:3/4;border-radius:5px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.06)}
.tc-img{width:100%;height:75%;object-fit:cover}
.tc-foot{padding:4px 5px 5px;background:#0d1929}
.tc-name{height:5px;border-radius:2px;background:rgba(255,255,255,.15);margin-bottom:3px}
.tc-date{height:4px;border-radius:2px;background:rgba(255,255,255,.07);width:60%}
.tc-type{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:3px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.tc-type span{width:8px;height:8px;border-radius:1.5px;background:#8b5cf6}

/* ─────────── MOCKUP 2 : DOCUMENT ─────────── */
.doc-area{flex:1;background:#0a1625;position:relative;overflow:hidden}
.doc-paper{position:absolute;inset:12px;background:linear-gradient(160deg,#1e3050 0%,#162540 100%);border-radius:3px;overflow:hidden}
.doc-header{height:22px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 10px;gap:8px}
.doc-seal{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(249,115,22,.5);background:rgba(249,115,22,.08)}
.doc-head-lines{display:flex;flex-direction:column;gap:3px;flex:1}
.dhl{height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.doc-body-content{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.doc-line{height:4px;border-radius:2px;background:rgba(255,255,255,.09)}
.doc-line.w90{width:90%}.doc-line.w75{width:75%}.doc-line.w85{width:85%}.doc-line.w60{width:60%}.doc-line.w95{width:95%}.doc-line.w70{width:70%}.doc-line.w80{width:80%}
/* zones overlay */
.dzone{position:absolute;border:1.5px solid;border-radius:2px;pointer-events:none}
.dzone.v{border-color:rgba(139,92,246,.8);background:rgba(139,92,246,.07)}
.dzone.o{border-color:rgba(249,115,22,.8);background:rgba(249,115,22,.07)}
.dzone.g{border-color:rgba(52,211,153,.8);background:rgba(52,211,153,.07)}
.dz-lbl{position:absolute;top:-17px;left:0;font-size:8px;color:#fff;white-space:nowrap;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:2px;font-weight:500}
/* panel */
.doc-panel{width:164px;background:#08111e;border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.dp-section{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.dp-lbl{font-size:8px;color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.dp-val{height:12px;background:rgba(255,255,255,.09);border-radius:2px}
.dp-val.s{width:65%}.dp-val.xs{width:40%}
.dp-tag{display:inline-flex;height:16px;padding:0 7px;border-radius:3px;align-items:center;font-size:8px;font-weight:500;background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.25)}
.dp-lines{display:flex;flex-direction:column;gap:4px}
.dp-textline{height:4px;border-radius:2px;background:rgba(255,255,255,.08)}
.dp-textline.l{width:95%}.dp-textline.m{width:78%}.dp-textline.s2{width:60%}
.dp-person{display:flex;align-items:center;gap:6px;padding:8px 12px}
.dp-avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6d28d9);flex-shrink:0}
.dp-pname{height:8px;background:rgba(255,255,255,.12);border-radius:2px;flex:1}

/* ─────────── MOCKUP 3 : ARCHIVES ─────────── */
.arc-header{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;flex-shrink:0;background:#070e1a}
.arc-hval{height:10px;background:rgba(255,255,255,.15);border-radius:2px}
.arc-hbadge{height:18px;padding:0 8px;border-radius:4px;font-size:9px;display:flex;align-items:center;background:rgba(139,92,246,.15);color:#b39dff;border:1px solid rgba(139,92,246,.25);white-space:nowrap;margin-left:auto}
.arc-cols{display:flex;padding:6px 12px 5px;border-bottom:1px solid rgba(255,255,255,.04);gap:8px}
.arc-col-lbl{height:5px;background:rgba(255,255,255,.07);border-radius:2px}
.arc-body{flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.arc-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;border:1px solid transparent}
.arc-row.sel{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.18)}
.arc-row:not(.sel){background:rgba(255,255,255,.025)}
.arc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.arc-date{height:7px;border-radius:2px;background:rgba(255,255,255,.18);width:52px;flex-shrink:0}
.arc-name{height:7px;border-radius:2px;background:rgba(255,255,255,.12);flex:1}
.arc-role{height:16px;padding:0 6px;border-radius:3px;font-size:8px;display:flex;align-items:center;font-weight:600;white-space:nowrap;flex-shrink:0}
.arc-action{width:16px;height:16px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);flex-shrink:0}

/* TRUST */
.tbar{border-top:1px solid var(--brd);border-bottom:1px solid var(--brd);padding:22px 0;background:var(--sur)}
.tbar-in{display:flex;align-items:center;justify-content:space-around;gap:24px;flex-wrap:wrap}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tv{font-family:Georgia,serif;font-size:26px;color:var(--tx);line-height:1}
.tv .u{font-size:14px;color:var(--ac)}
.tl{font-size:11px;color:var(--txm);letter-spacing:.07em;text-transform:uppercase}
.tsep{width:1px;height:28px;background:var(--brd2)}
@media(max-width:600px){.tsep{display:none}}

/* FEATURE SECTIONS */
.feat{padding:80px 0;border-top:1px solid var(--brd)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
/* swap order for reversed sections using CSS order */
.fg.rev > .fg-text{order:2}
.fg.rev > .fg-mock{order:1}
@media(max-width:800px){
  .fg{grid-template-columns:1fr;gap:40px}
  .fg.rev > .fg-text{order:unset}
  .fg.rev > .fg-mock{order:unset}
}
h2.st{font-family:Georgia,serif;font-size:clamp(24px,3vw,38px);font-weight:normal;color:var(--tx);line-height:1.2;text-wrap:balance;margin-bottom:14px;letter-spacing:-.3px}
.sdesc{font-size:15px;color:var(--txm);line-height:1.7;max-width:460px}
.flist{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:22px}
.flist li{display:flex;gap:10px;font-size:14px;color:var(--txm);align-items:flex-start;line-height:1.5}
.flist li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ac);flex-shrink:0;margin-top:8px}

/* CAPS */
.caps{background:var(--sur);padding:88px 0}
.chd{text-align:center;margin-bottom:48px}
.chd .eyebrow{justify-content:center}
.chd .st{max-width:none}
.chd .sdesc{margin:12px auto 0;text-align:center;max-width:480px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd);border:1px solid var(--brd);border-radius:10px;overflow:hidden}
.cc{background:var(--sur);padding:26px;transition:background .15s}
.cc:hover{background:var(--sur2)}
.ci{width:34px;height:34px;border-radius:7px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px}
.ci span{border-radius:1px;display:block}
.ct{font-family:Georgia,serif;font-size:15px;font-weight:normal;color:var(--tx);margin-bottom:6px}
.cd{font-size:13px;color:var(--txm);line-height:1.55}
@media(max-width:768px){.cgrid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.cgrid{grid-template-columns:1fr}}

/* PRIVACY */
.prv{padding:88px 0;position:relative;overflow:hidden}
.prv::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 700px 360px at 50% 50%,var(--acg),transparent);pointer-events:none}
.prv-in{text-align:center;max-width:560px;margin:0 auto;position:relative}
.pm{width:52px;height:52px;margin:0 auto 24px;background:var(--acs);border:1px solid rgba(139,92,246,.2);border-radius:13px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:10px}
.pm span{border-radius:2px;display:block}
.pm span:nth-child(1){background:#8b5cf6}.pm span:nth-child(2){background:#f97316}
.pm span:nth-child(3){background:#f97316}.pm span:nth-child(4){background:#8b5cf6}
.prv .st{max-width:none;margin-bottom:12px}
.prv .sdesc{max-width:none;text-align:center}
.prv-row{display:flex;justify-content:center;gap:44px;margin-top:44px;flex-wrap:wrap}
.ps{display:flex;flex-direction:column;align-items:center;gap:4px}
.psv{font-family:Georgia,serif;font-size:28px;color:var(--tx);line-height:1}
.psl{font-size:12px;color:var(--txm)}

/* DOWNLOAD */
.dls{background:var(--sur);padding:80px 0;border-top:1px solid var(--brd)}
.dlg{display:grid;grid-template-columns:1fr auto;gap:64px;align-items:center}
.dln{margin-top:12px;font-size:12px;color:var(--txf);line-height:1.6}
.dlm{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.dlr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txm)}
.dld{width:5px;height:5px;border-radius:50%;background:var(--ac);flex-shrink:0}
@media(max-width:600px){.dlg{grid-template-columns:1fr;gap:32px}.dlm{align-items:flex-start}}

footer{padding:28px 0;border-top:1px solid var(--brd)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:9px;font-family:Georgia,serif;font-size:15px;color:var(--tx)}
.flinks{display:flex;gap:20px;list-style:none}
.flinks a{font-size:13px;color:var(--txm);transition:color .15s}
.flinks a:hover{color:var(--tx)}
.fc{font-size:12px;color:var(--txf)}

@media(prefers-reduced-motion:no-preference){
  .fu{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
  .fu.in{opacity:1;transform:none}
  .fu.d1{transition-delay:.1s}.fu.d2{transition-delay:.2s}
}
</style>

alités dont vous n'avez jamais besoin.","cartes":[{"titre":"Multi-archives","description":"Organisez vos sources par fonds distincts — archives départementales, fonds familial, archives d'église.","couleur":"violet"},{"titre":"Albums photo","description":"Galeries ordonnées avec légendes, recadrage, effets. Diaporama et export PDF intégrés.","couleur":"orange"},{"titre":"Frise chronologique","description":"Tous vos événements sur un axe temporel. Tri ascendant/descendant, filtres, éléments sans date.","couleur":"vert"},{"titre":"Fiches & Personnes","description":"Fiche individu avec photo, dates et lieux. Fusion de doublons, consultation des actes liés.","couleur":"violet"},{"titre":"Tags & Recherche","description":"Étiquettes colorées sur documents et fiches. Recherche plein-texte, transcriptions incluses.","couleur":"orange"},{"titre":"HTR — Lecture auto","description":"Transcription automatique des manuscrits via Ollama. Le modèle IA tourne entièrement sur votre machine.","couleur":"or"}]},"confidentialite":{"titre":"Tout reste chez vous.\nSans exception.","description":"Onésime ne possède aucun serveur, aucun compte, aucune télémétrie. La base de données vit sur votre ordinateur. Ce que vous archivez n'appartient qu'à vous.","stats":[{"valeur":"0","libelle":"serveur distant"},{"valeur":"0","libelle":"compte requis"},{"valeur":"0","libelle":"télémétrie"},{"valeur":"∞","libelle":"données chez vous"}]},"telechargement":{"titre":"Prêt à commencer ?","description":"Onésime est gratuit. Téléchargez, installez, commencez. Aucun formulaire, aucune carte bancaire.","note":"Windows 10 / 11 · macOS Apple Silicon & Intel — Si Windows affiche un avertissement : Informations complémentaires → Exécuter quand même · Sur macOS : Clic droit → Ouvrir au premier lancement","meta":["Windows 10 / 11","macOS (Apple Silicon & Intel)","Fonctionne hors-ligne","Aucune installation serveur","Données locales uniquement","Gratuit"]},"footer":{"copyright":"© 2026 Amélien BRISEBARD & LCG","liens":[{"texte":"Licence","href":"LICENSE"},{"texte":"Releases","href":"../../releases"}]}};

const CC={violet:['rgba(139,92,246,.1)','#8b5cf6','#f97316','#f97316','#8b5cf6'],orange:['rgba(249,115,22,.08)','#f97316','rgba(249,115,22,.3)','rgba(249,115,22,.3)','#f97316'],vert:['rgba(52,211,153,.08)','#34d399','rgba(52,211,153,.25)','rgba(52,211,153,.25)','#34d399'],or:['rgba(196,150,42,.1)','#c4962a','rgba(196,150,42,.35)','rgba(196,150,42,.35)','#c4962a']};

const DL_IC=`<svg style="width:13px;height:13px;flex-shrink:0" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7M4 5.5l2.5 2.5L9 5.5M1.5 10.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ── Mockup Explorateur ────────────────────────────────────────────── */
const THUMBS=[
  {g:'linear-gradient(160deg,#5a3d1e 0%,#3d2512 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#1a2d4a 0%,#0f1e35 100%)',tag:'doc'},
  {g:'linear-gradient(160deg,#3d2e1a 0%,#2a1e0e 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#1e3040 0%,#121e2e 100%)',tag:'doc'},
  {g:'linear-gradient(160deg,#2a1a0a 0%,#1a0e04 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#1a1a2e 0%,#0f0f1e 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#2e2416 0%,#1e180c 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#0e1e30 0%,#081420 100%)',tag:'doc'},
  {g:'linear-gradient(160deg,#3a2a18 0%,#261c0e 100%)',tag:'photo'},
  {g:'linear-gradient(160deg,#1c2e44 0%,#101e30 100%)',tag:'doc'},
];
function mockupExplorer(){
  const thumbs=THUMBS.map(t=>`
    <div class="tc">
      <div class="tc-img" style="background:${t.g}"></div>
      <div class="tc-foot"><div class="tc-name"></div><div class="tc-date"></div></div>
      ${t.tag==='doc'?'<div class="tc-type"><span style="background:rgba(249,115,22,.8)"></span></div>':''}
    </div>`).join('');
  return `<div class="aw fu d1">
    <div class="atb">
      <span class="atxt">Explorateur — Archives familiales</span>
      <div class="awctrls"><div class="awctrl">&#8722;</div><div class="awctrl">&#9633;</div><div class="awctrl cls">&#215;</div></div>
    </div>
    <div class="abody" style="height:300px">
      <div class="asb">
        ${[1,2,3,4,5,6].map((n,i)=>`<div class="si${i===0?' on':''}"><div class="si-ic"></div>${i===2?'<div class="si-dot"></div>':''}</div>`).join('')}
      </div>
      <div class="exp-main">
        <div class="exp-toolbar">
          <div class="exp-search"><div class="exp-search-ic"></div><div class="exp-search-line"></div></div>
          <div class="exp-pill on">Tous</div>
          <div class="exp-pill">Photos</div>
          <div class="exp-pill">Docs</div>
          <div class="exp-count">247 fichiers</div>
        </div>
        <div class="exp-grid">${thumbs}</div>
      </div>
    </div>
  </div>`;
}

/* ── Mockup Document ───────────────────────────────────────────────── */
function mockupDocument(){
  return `<div class="aw fu d1">
    <div class="atb">
      <span class="atxt">Acte de naissance — Jean MOREAU, 1847</span>
      <div class="awctrls"><div class="awctrl">&#8722;</div><div class="awctrl">&#9633;</div><div class="awctrl cls">&#215;</div></div>
    </div>
    <div class="abody" style="height:310px">
      <div class="doc-area">
        <div class="doc-paper">
          <div class="doc-header">
            <div class="doc-seal"></div>
            <div class="doc-head-lines">
              <div class="dhl" style="width:55%"></div>
              <div class="dhl" style="width:35%;background:rgba(255,255,255,.08)"></div>
            </div>
          </div>
          <div class="doc-body-content">
            <div class="doc-line w90"></div><div class="doc-line w75"></div>
            <div class="doc-line w95"></div><div class="doc-line w60"></div>
            <div class="doc-line w85"></div><div class="doc-line w70"></div>
            <div class="doc-line w80"></div><div class="doc-line w90"></div>
          </div>
          <!-- Zones -->
          <div class="dzone v" style="top:30px;left:52%;right:8%;height:28px">
            <div class="dz-lbl">Signature officier</div>
          </div>
          <div class="dzone o" style="top:72px;left:8%;width:38%;height:22px">
            <div class="dz-lbl">Date de naissance</div>
          </div>
          <div class="dzone g" style="top:110px;left:20%;width:44%;height:20px">
            <div class="dz-lbl">Nom du père</div>
          </div>
        </div>
      </div>
      <div class="doc-panel">
        <div class="dp-section">
          <div class="dp-lbl">Titre</div>
          <div class="dp-val"></div>
        </div>
        <div class="dp-section">
          <div class="dp-lbl">Date</div>
          <div class="dp-val xs"></div>
        </div>
        <div class="dp-section">
          <div class="dp-lbl">Type</div>
          <div class="dp-tag">Acte civil</div>
        </div>
        <div class="dp-section">
          <div class="dp-lbl">Transcription</div>
          <div class="dp-lines">
            <div class="dp-textline l"></div>
            <div class="dp-textline m"></div>
            <div class="dp-textline l"></div>
            <div class="dp-textline s2"></div>
          </div>
        </div>
        <div class="dp-person">
          <div class="dp-avatar"></div>
          <div class="dp-pname"></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── Mockup Archives ───────────────────────────────────────────────── */
const ARC_ROWS=[
  {dot:'#8b5cf6',bg:'rgba(139,92,246,.15)',col:'#b39dff',lbl:'Baptême',sel:true,w:'75%'},
  {dot:'#f97316',bg:'rgba(249,115,22,.12)',col:'#fb923c',lbl:'Mariage',sel:false,w:'82%'},
  {dot:'#34d399',bg:'rgba(52,211,153,.1)',col:'#6ee7b7',lbl:'Décès',sel:false,w:'68%'},
  {dot:'#8b5cf6',bg:'rgba(139,92,246,.15)',col:'#b39dff',lbl:'Baptême',sel:false,w:'71%'},
  {dot:'#f97316',bg:'rgba(249,115,22,.12)',col:'#fb923c',lbl:'Mariage',sel:false,w:'88%'},
  {dot:'#f59e0b',bg:'rgba(245,158,11,.12)',col:'#fcd34d',lbl:'Notaire',sel:false,w:'64%'},
];
function mockupArchives(){
  const rows=ARC_ROWS.map(r=>`
    <div class="arc-row${r.sel?' sel':''}">
      <div class="arc-dot" style="background:${r.dot}"></div>
      <div class="arc-date"></div>
      <div class="arc-name" style="width:${r.w}"></div>
      <div class="arc-role" style="background:${r.bg};color:${r.col}">${r.lbl}</div>
      <div class="arc-action"></div>
    </div>`).join('');
  return `<div class="aw fu">
    <div class="atb">
      <span class="atxt">Registre BMS — Paroisse Sainte-Marie 1820–1860</span>
      <div class="awctrls"><div class="awctrl">&#8722;</div><div class="awctrl">&#9633;</div><div class="awctrl cls">&#215;</div></div>
    </div>
    <div class="abody" style="height:300px;flex-direction:column">
      <div class="arc-header">
        <div class="arc-hval" style="width:140px"></div>
        <div class="arc-hbadge">38 actes</div>
      </div>
      <div class="arc-cols">
        <div class="arc-col-lbl" style="width:52px"></div>
        <div class="arc-col-lbl" style="width:80px"></div>
        <div class="arc-col-lbl" style="flex:1"></div>
        <div class="arc-col-lbl" style="width:48px"></div>
      </div>
      <div class="arc-body">${rows}</div>
    </div>
  </div>`;
}

/* ── Render ────────────────────────────────────────────────────────── */
function render(d){
  const a=d.app;
  // Nav
  document.getElementById('nb').innerHTML=`<div class="lm" style="width:32px;height:32px"><span></span><span></span><span></span><span></span></div>${a.nom}`;
  document.getElementById('nl').innerHTML=d.nav.liens.map(l=>`<li><a href="${l.href}">${l.texte}</a></li>`).join('');
  document.getElementById('ndl').textContent='Windows · macOS';

  // Hero
  const h=d.hero;
  const heroHtml=`<section class="hero"><div class="hero-glow"></div><div class="wrap"><div class="hero-g">
    <div class="fu">
      <div class="eyebrow">${h.accroche}</div>
      <h1 class="htitle">${h.titre}<br><span class="hi">${h.titreAccent}</span></h1>
      <p class="hdesc">${h.description}</p>
      <div class="hact">
        <a href="#telechargement" class="btn-p">${DL_IC}Télécharger gratuitement</a>
        <a href="#fonctionnalites" class="btn-g">Voir les fonctionnalités</a>
      </div>
      <p class="hnote">${h.note}</p>
    </div>
    ${mockupExplorer()}
  </div></div></section>`;

  // Trust
  const trust=`<div class="tbar"><div class="wrap tbar-in">${d.barreStats.map((s,i)=>`<div class="ti"><div class="tv">${s.valeur}<span class="u">${s.unite}</span></div><div class="tl">${s.libelle}</div></div>${i<d.barreStats.length-1?'<div class="tsep"></div>':''}`).join('')}</div></div>`;

  // Features
  const feats=d.sectionsFeatures.map((f,i)=>{
    const rev=i%2===1;
    const mock=i===0?mockupDocument():mockupArchives();
    return `<section class="feat"${i===0?' id="fonctionnalites"':''}>
      <div class="wrap"><div class="fg${rev?' rev':''}">
        <div class="fg-text fu${rev?' d1':''}">
          <div class="eyebrow">${f.oeil}</div>
          <h2 class="st">${f.titre}</h2>
          <p class="sdesc">${f.description}</p>
          <ul class="flist">${f.points.map(p=>`<li>${p}</li>`).join('')}</ul>
        </div>
        <div class="fg-mock ${rev?'fu':'fu d1'}">${mock}</div>
      </div></div>
    </section>`;
  }).join('');

  // Caps
  const caps=d.capacites;
  const cards=caps.cartes.map((c,i)=>{
    const [bg,s1,s2,s3,s4]=CC[c.couleur]||CC.violet;
    return `<div class="cc fu ${['','d1','d2'][i%3]}">
      <div class="ci" style="background:${bg}">
        <span style="background:${s1}"></span><span style="background:${s2}"></span>
        <span style="background:${s3}"></span><span style="background:${s4}"></span>
      </div>
      <div class="ct">${c.titre}</div><p class="cd">${c.description}</p>
    </div>`;
  }).join('');
  const capsHtml=`<section class="caps"><div class="wrap">
    <div class="chd fu"><div class="eyebrow">${caps.accroche}</div><h2 class="st">${caps.titre}</h2><p class="sdesc">${caps.description}</p></div>
    <div class="cgrid">${cards}</div>
  </div></section>`;

  // Privacy
  const prv=d.confidentialite;
  const prvHtml=`<section class="prv" id="confidentialite"><div class="wrap"><div class="prv-in fu">
    <div class="pm"><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow" style="justify-content:center">Confidentialité</div>
    <h2 class="st">${prv.titre.replace('\n','<br>')}</h2>
    <p class="sdesc">${prv.description}</p>
    <div class="prv-row">${prv.stats.map(s=>`<div class="ps"><div class="psv">${s.valeur}</div><div class="psl">${s.libelle}</div></div>`).join('')}</div>
  </div></div></section>`;

  // Download
  const dl=d.telechargement;
  const dlHtml=`<section class="dls" id="telechargement"><div class="wrap"><div class="dlg fu">
    <div>
      <div class="eyebrow">Téléchargement</div>
      <h2 class="st" style="margin-bottom:10px">${dl.titre}</h2>
      <p class="sdesc">${dl.description}</p>
      <div style="margin-top:26px"><a href="${a.lienTelechargement}" class="btn-p">${DL_IC}Télécharger v${a.version}</a></div>
      <p class="dln">${dl.note}</p>
    </div>
    <div class="dlm">${dl.meta.map((m,i)=>`<div class="dlr"><div class="dld" style="${i===dl.meta.length-1?'background:var(--ct)':''}"></div>${m}</div>`).join('')}</div>
  </div></div></section>`;

  // Footer
  const ft=d.footer;
  const ftHtml=`<footer><div class="wrap ft">
    <div class="fb"><div class="lm" style="width:24px;height:24px;padding:4px;gap:2px;border-radius:5px"><span></span><span></span><span></span><span></span></div>${a.nom}</div>
    <ul class="flinks">${ft.liens.map(l=>`<li><a href="${l.href}">${l.texte}</a></li>`).join('')}</ul>
    <p class="fc">${ft.copyright}</p>
  </div></footer>`;

  document.getElementById('app').innerHTML=heroHtml+trust+feats+capsHtml+prvHtml+dlHtml+ftHtml;

  // Nav bg
  function navBg(){
    const n=document.getElementById('nav');if(!n)return;
    const dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
    n.style.background=dk?'rgba(9,15,28,.88)':'rgba(244,237,224,.92)';
  }
  navBg();
  new MutationObserver(navBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',navBg);

  // Animations
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.08,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll('.fu').forEach(el=>io.observe(el));
  requestAnimationFrame(()=>document.querySelectorAll('.fu').forEach(el=>{if(el.getBoundingClientRect().top<window.innerHeight)el.classList.add('in');}));
}

fetch('contenu.json')
  .then(r => { if (!r.ok) { throw new Error('fetch failed'); } return r.json(); })
  .then(data => render(data))
  .catch(() => render(F));
</script>
